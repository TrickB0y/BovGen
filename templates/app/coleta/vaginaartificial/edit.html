<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Coleta</title>
</head>
<body>
    <a href="{{ url_for('menu.index') }}">Inicio</a>
    <br><br>
    <form method="post">
        <label for="coletaDados-vacaORmanequim">Vaca ou manequim?</label>
        <select id="coletaDados-vacaORmanequim" name="vacaORmanequim" size="1">
            <option value="">Não selecionado</option>
            <option value="VACA">VACA</option>
            <option value="MANEQUIM">MANEQUIM</option>
        </select>
        <br>
        <label for="coletaDados-vaca">Nome da vaca</label>
        <input id="coletaDados-vaca" name="vaca" type="text" value="{% if dadosColeta['vaca'] == none %}{% else %}{{ dadosColeta['vaca'] }}{% endif %}">
        <br><br>
        <input type="submit" value="Entregar coleta">
    </form>
    <br><br>
    <div class="flash-messages">
    {% for message in get_flashed_messages() %}
        <div class="flash">{{ message }}</div>
    {% endfor %}
    </div>
    {% if dadosColeta['vacaORmanequim'] != none %}
    <script>
        const vacaORmanequimSelect = document.getElementById("coletaDados-vacaORmanequim");
        vacaORmanequimSelect.value = "{{ dadosColeta['vacaORmanequim'] }}";
    </script>
    {% endif %}
</body>
</html>
